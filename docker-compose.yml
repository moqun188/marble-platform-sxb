version: "3.8"

services:
  marble-api:
    build:
      context: ./backend
      dockerfile: ../Dockerfile
    container_name: marble-api
    restart: unless-stopped
    ports:
      - "3200:3200"
    environment:
      - NODE_ENV=production
      - PORT=3200
      - LOG_LEVEL=info
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3200/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    mem_limit: 256m
    cpus: "0.5"
