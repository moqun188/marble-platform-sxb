version: '3.8'

services:
  marble:
    build: .
    container_name: marble-platform
    ports:
      - "3200:3200"
    environment:
      - NODE_ENV=production
      - PORT=3200
    restart: unless-stopped
    volumes:
      # 挂载数据目录 (如果需要动态更新数据)
      - ./backend/marble-data:/app/backend/marble-data:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3200/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
