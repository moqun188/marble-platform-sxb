# Marble Knowledge Graph Platform — Nginx 配置
# 放到 /etc/nginx/sites-available/marble, 然后 ln -s 到 sites-enabled

server {
    listen 80;
    server_name _;  # 改成你的域名, 如 marble.example.com

    # Gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml;
    gzip_min_length 1024;
    gzip_vary on;

    # 前端静态文件 (Vite build 产物)
    root /opt/marble/frontend-dist;
    index index.html;

    # 前端路由 — SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 反向代理
    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Rate limit 透传
        proxy_set_header X-Request-ID $request_id;

        # 超时
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    # 静态资源缓存 (Vite 带 hash 的文件)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # favicon
    location = /favicon.svg {
        expires 7d;
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # 日志
    access_log /var/log/nginx/marble_access.log;
    error_log /var/log/nginx/marble_error.log;
}
